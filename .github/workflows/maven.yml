name: Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 27
        uses: actions/setup-java@v5
        with:
          java-version: '27'
          distribution: 'temurin'
          cache: maven

      - name: Build and run tests
        run: mvn -B verify
