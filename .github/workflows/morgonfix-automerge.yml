name: Morgonfix auto-merge

# Nattrutinen committar sina fixar till auto/morgonfix och öppnar en PR. Förut stod PR:en och
# väntade på en människa - i drift nådde ingenting fram förrän någon klickade merge. Nu mergas
# den här när "Build & Test" gått grönt på exakt den commit som ligger överst i PR:en.
#
# Workflow_run körs alltid från master-versionen av den här filen, så en ändring på grenen kan
# inte ändra reglerna för sin egen merge. Vakten nedan stoppar ändå en PR som rör workflows,
# Claude-inställningar, byggfilerna eller rutinens egna regler - de ska granskas av en människa.
# Efter merge väntar den på deployen och gör en revert-commit om tjänsten inte kommer upp.

on:
  workflow_run:
    workflows: ["Build & Test"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_branch == 'auto/morgonfix' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Hitta PR:en
        id: pr
        run: |
          nr=$(gh pr list -R "$REPO" --head auto/morgonfix --base master --state open --json number -q '.[0].number')
          if [ -z "$nr" ]; then echo "Ingen öppen morgonfix-PR"; exit 0; fi
          echo "nr=$nr" >> "$GITHUB_OUTPUT"

      - name: Vakt - filer som kräver en människa
        if: steps.pr.outputs.nr != ''
        run: |
          filer=$(gh pr view "${{ steps.pr.outputs.nr }}" -R "$REPO" --json files -q '.files[].path')
          echo "$filer"
          antal=$(echo "$filer" | grep -c . || true)
          # docs/nattrutin.md är rutinens egna regler och scripts/ dess mätning - en rutin som
          # skriver om sina egna regler och mergar dem själv har ingen gräns kvar
          forbjudna=$(echo "$filer" | grep -E '^(\.github/|\.claude/|\.mvn/|mvnw|pom\.xml$|Dockerfile$|render\.yaml$|docs/nattrutin\.md$|scripts/)' || true)
          if [ -n "$forbjudna" ]; then
            echo "::warning::Morgonfix-PR:en rör filer som kräver granskning - ingen auto-merge:"
            echo "$forbjudna"
            exit 1
          fi
          # Rutinens tak är 5 filer per natt plus loggboken och atgarder.json
          if [ "$antal" -gt 12 ]; then
            echo "::warning::$antal filer i PR:en - över taket, ingen auto-merge"
            exit 1
          fi

      - name: Merga
        id: merge
        if: steps.pr.outputs.nr != ''
        run: |
          # --match-head-commit: har grenen fått en ny commit sedan bygget startade mergas ingenting
          gh pr merge "${{ steps.pr.outputs.nr }}" -R "$REPO" --merge --delete-branch --match-head-commit "$SHA"
          merge=$(gh pr view "${{ steps.pr.outputs.nr }}" -R "$REPO" --json mergeCommit -q '.mergeCommit.oid')
          echo "Mergad som $merge"
          echo "sha=$merge" >> "$GITHUB_OUTPUT"

      # Efter merge deployar Render. Kommer tjänsten inte upp på den nya koden rullar Render
      # själv tillbaka till förra versionen (a4e09e0 09-13) - men master står kvar trasig, och
      # nästa deploy av vad som helst faller igen. Därför: vänta på den nya commiten i
      # /api/version, kolla /api/health, och gör en revert-commit om något av dem inte håller.
      # Groq-hälsan kollas INTE här: en avvecklad modell är inget en morgonfix orsakar.
      - name: Kontrollera deployen
        id: deploy
        if: steps.merge.outputs.sha != ''
        env:
          MERGE: ${{ steps.merge.outputs.sha }}
        run: |
          kort=${MERGE:0:7}
          for i in $(seq 1 45); do
            commit=$(curl -s -m 20 https://caradvice.onrender.com/api/version | grep -o '"commit":"[^"]*"' | cut -d'"' -f4)
            if [ "${commit:0:7}" = "$kort" ]; then echo "Deployad: $commit efter $((i*20)) s"; break; fi
            sleep 20
          done
          if [ "${commit:0:7}" != "$kort" ]; then
            echo "::error::$kort kom aldrig ut på Render inom 15 min (kör fortfarande ${commit:-okänt}) - tjänsten startade troligen inte"
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          sleep 60   # DataLoader och MorgonfixAtgarder hinner köra färdigt efter uppstarten
          svar=$(curl -s -m 30 -w ' HTTP%{http_code}' https://caradvice.onrender.com/api/health)
          echo "$svar"
          case "$svar" in
            *'"status":"OK"'*HTTP200) echo "ok=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::/api/health efter deployen: $svar"; echo "ok=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Revert om deployen inte höll
        if: steps.deploy.outputs.ok == 'false'
        env:
          MERGE: ${{ steps.merge.outputs.sha }}
        run: |
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" repo
          cd repo
          git config user.name "morgonfix-automerge"
          git config user.email "actions@users.noreply.github.com"
          git revert --no-edit -m 1 "$MERGE"
          git commit --amend -q -m "Revert morgonfix $(echo $MERGE | cut -c1-7): deployen höll inte" -m "Automatisk revert från morgonfix-automerge.yml - tjänsten kom inte upp eller /api/health var inte OK efter merge. Nattrutinen ser reverten nästa natt och ska läsa Render-loggen i stället för att laga om samma sak."
          git push origin HEAD:master
          echo "::warning::Morgonfixen revertad - se commit $(git rev-parse --short HEAD)"
